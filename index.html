<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wangchuk Tracker</title>

    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="antialiased selection:bg-indigo-500 selection:text-white">

    <!-- App Container -->
    <div id="app" class="min-h-screen relative z-10">
        <!-- SPA Content Injected Here -->
        <div class="flex items-center justify-center min-h-screen">
            <div class="animate-pulse flex flex-col items-center">
                <div class="w-12 h-12 border-4 border-white/30 border-t-white rounded-full animate-spin mb-4"></div>
                <div class="text-white/80 font-medium">Loading Wangchuk Tracker...</div>
            </div>
        </div>
    </div>

    <!-- Background Elements (can be moved to CSS body var, but divs allow animation) -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-purple-500/30 rounded-full blur-3xl animate-pulse">
        </div>
        <div
            class="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-blue-500/20 rounded-full blur-3xl animate-pulse delay-1000">
        </div>
    </div>

    <!-- Application Script -->
    <script src="/static/js/app.js"></script>
</body>

</html>
